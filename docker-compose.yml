services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # host.docker.internal lets the container reach Postgres running on
      # your host machine (Docker Desktop resolves this automatically on
      # Windows/Mac). Override any of these if your local instance differs.
      DB_URL: ${DB_URL:-jdbc:postgresql://host.docker.internal:5432/wallet}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-abcd@123}
      JWT_SECRET: dev-only-change-me-please-32-bytes-minimum-for-hs256
      JWT_EXPIRATION_MS: 3600000
    ports:
      - "${APP_PORT:-8081}:8080"
